# Proposed hosted judging demo. This is a PAID service with a persistent disk.
# Creating a Blueprint provisions resources: review the displayed bill first.
# Source publication alone does not deploy or provision anything.
services:
  - type: web
    name: fairhold-demo
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: fairhold-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: FAIRHOLD_DATA_FILE
        value: /var/data/fairhold.json
      - key: FAIRHOLD_APP_URL
        sync: false
      - key: DEMO_ACCESS_USER
        value: judge
      - key: DEMO_ACCESS_PASSWORD
        generateValue: true
# Add PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, AI_API_KEY and any AI_MODEL /
# AI_BASE_URL overrides privately in the service Environment tab before the
# real-integration demo. Until then, both fallbacks remain visibly labeled.
