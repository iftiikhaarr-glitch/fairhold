# Free judging demo. Render supplies RENDER_EXTERNAL_URL for PayPal returns.
# A durable external PostgreSQL database is required because the free service
# loses local files whenever it sleeps or restarts. Set DATABASE_URL privately.
services:
  - type: web
    name: fairhold-demo
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: FAIRHOLD_STORAGE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ACCESS_USER
        value: judge
      - key: DEMO_ACCESS_PASSWORD
        generateValue: true
# PayPal sandbox and AI credentials are optional and must be set privately in
# the Render dashboard. Without them, both modes are clearly labeled demos.
